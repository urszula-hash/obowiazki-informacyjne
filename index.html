<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obowiązki informacyjne</title>
<meta name="description" content="Ćwiczenie z architektury rynku kapitałowego: 44 scenariusze z życia spółki publicznej, wynik sali w Google Forms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --fg:#000000; --line:#000000; --fill:#ececec;
  --ok:#15803d; --bad:#b91c1c;
  --B:#1d4ed8; --O:#7e22ce; --P:#c2410c; --T:#0f766e; --Z:#a16207;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111111; --fg:#ffffff; --line:#ffffff; --fill:#2a2a2a;
    --ok:#5fd38a; --bad:#ff7b7b; --B:#7aa2ff; --O:#c792ff; --P:#ff9a5c; --T:#4fd1c5; --Z:#e8bf4f; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#111111; --fg:#ffffff; --line:#ffffff; --fill:#2a2a2a;
  --ok:#5fd38a; --bad:#ff7b7b; --B:#7aa2ff; --O:#c792ff; --P:#ff9a5c; --T:#4fd1c5; --Z:#e8bf4f; color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px;min-height:100svh;display:flex;flex-direction:column}
h1{font-size:30px;font-weight:800;line-height:1.1;margin:8px 0 14px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:400;line-height:1.45;margin:0}
p{margin:0 0 12px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px;background:transparent}
.card h3{font-size:17px;font-weight:600;margin:0 0 6px}
.card.fill{background:var(--fill)}
.bar{height:6px;border:1px solid var(--line);border-radius:3px;margin:4px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg)}
.btn{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:transparent;
  border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;margin:0 0 10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s}
.btn b{display:block;font-weight:600}
.btn span{display:block;font-size:14px}
.btn:active,.btn:hover{background:var(--fill)}
.btn.on{background:var(--fill);box-shadow:inset 0 0 0 2px var(--line)}
.btn.main{background:var(--fill);text-align:center;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row .btn{text-align:center}
.link{background:none;border:none;color:var(--fg);font:inherit;font-size:15px;text-decoration:underline;padding:8px 0;cursor:pointer}
.small{font-size:14px}
.kB{color:var(--B)}.kO{color:var(--O)}.kP{color:var(--P)}.kT{color:var(--T)}.kZ{color:var(--Z)}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.score{font-size:46px;font-weight:800;line-height:1;margin:4px 0 6px}
.disc{font-size:13px;margin-top:auto;padding-top:18px}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sala main{max-width:1200px}
.sala h1{font-size:44px}
.sala h2{font-size:32px;line-height:1.35}
.sala .card{font-size:24px;padding:22px 26px}
.sala .card h3{font-size:26px}
.sala .btn{font-size:22px}
.sala .small{font-size:19px}
.jump{font:inherit;width:90px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--fg)}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ================== RODZAJE ================== */
const KAT = {
  B:'Raport bieżący',
  O:'Raport okresowy',
  P:'Informacja poufna',
  T:'Zgłoszenie transakcji insidera',
  Z:'Zawiadomienie o znacznym pakiecie akcji'
};
const KOD = Object.keys(KAT);

/* ================== CASE ==================
   Treść scenariuszy i objaśnień: karta ćwiczeń z kluczem odpowiedzi.
   tak – czy potrzebna publikacja lub zawiadomienie; r – rodzaje wymagane; o – rodzaje też uznawane;
   h – nagłówek odpowiedzi z klucza; e – objaśnienie z klucza. */
const CASE = [{"q": "Fundusz inwestycyjny nabywa na rynku regulowanym akcje spółki giełdowej, w wyniku czego jego udział w ogólnej liczbie głosów wzrasta z 4% do 6%.", "tak": true, "r": "Z", "o": "B", "h": "Znaczne pakiety akcji", "e": "Kto: fundusz (akcjonariusz). Co: zawiadomienie o przekroczeniu progu 5%. Komu: KNF i spółka. Kiedy: niezwłocznie, najpóźniej w 6 dni sesyjnych od dnia zawarcia transakcji (zakup na rynku regulowanym). Podstawa: art. 69 ustawy o ofercie. Spółka, po otrzymaniu zawiadomienia, publikuje je niezwłocznie (art. 70 pkt 1 ustawy o ofercie) — równocześnie do publicznej wiadomości, KNF i GPW."}, {"q": "Członek zarządu spółki podaje się do dymisji z powodów osobistych.", "tak": true, "r": "B", "o": "", "h": "Raport bieżący (osobowe)", "e": "Emitent publikuje niezwłocznie przez ESPI. Podstawa: § 5 pkt 5 rozporządzenia MF."}, {"q": "Prezes zarządu dowiaduje się nieformalnie, że według plotek krążących w branży konkurent planuje wrogie przejęcie spółki — żadne źródło tego nie potwierdza.", "tak": false, "r": "", "o": "", "h": "Brak obowiązku (jeszcze)", "e": "To nie jest informacja poufna — brak cechy „precyzyjna i konkretna” (art. 7 MAR). To plotka, nie fakt."}, {"q": "Spółka publikuje pełne sprawozdanie finansowe za cały rok obrotowy, zbadane przez biegłego rewidenta.", "tak": true, "r": "O", "o": "", "h": "Raport okresowy — roczny", "e": "Termin: do 4 miesięcy od zakończenia roku obrotowego."}, {"q": "Członek zarządu chce sprzedać swoje akcje 10 dni przed planowaną publikacją raportu rocznego.", "tak": false, "r": "", "o": "", "h": "Zakaz — okres zamknięty", "e": "30 dni przed publikacją raportu okresowego. Transakcja niedozwolona, chyba że spełniony jeden z czterech wyjątków. Brak transakcji = brak publikacji. Nic nie trzeba zgłaszać."}, {"q": "Zarząd spółki podejmuje wiążącą decyzję o rozpoczęciu negocjacji w sprawie przejęcia innej spółki giełdowej.", "tak": false, "r": "", "o": "", "h": "Brak obowiązku (etap pośredni)", "e": "Decyzja o rozpoczęciu negocjacji to etap pośredni rozciągniętego procesu. Takie etapy co do zasady nie podlegają ujawnieniu. Obowiązek powstaje, gdy proces się zakończy (np. podpisanie umowy) albo gdy nie da się zachować poufności. Trzy warunki opóźnienia dotyczą dopiero informacji, która już podlega ujawnieniu."}, {"q": "Akcjonariusz posiadający 40% głosów w spółce zwiększa swój udział do 41%.", "tak": true, "r": "Z", "o": "B", "h": "Znaczne pakiety akcji", "e": "Powyżej 33% każda zmiana o co najmniej 1 punkt procentowy wymaga zawiadomienia. Kto: akcjonariusz. Komu: KNF i spółka (obu adresatom). Spółka publikuje zawiadomienie (art. 70 pkt 1)."}, {"q": "Rada nadzorcza powołuje nowego, dodatkowego członka zarządu.", "tak": true, "r": "B", "o": "", "h": "Raport bieżący (osobowe)", "e": "§ 5 pkt 6 rozporządzenia MF."}, {"q": "Spółka notowana na rynku regulowanym publikuje raport za drugi kwartał roku obrotowego.", "tak": false, "r": "", "o": "", "h": "Brak obowiązku", "e": "Raporty kwartalne obowiązują tylko za I i III kwartał — za II i IV kwartał nie ma odrębnego raportu (pokrywają je raport półroczny i roczny)."}, {"q": "Wstępne, jeszcze niezaudytowane dane księgowe pokazują, że wynik kwartału będzie o 40% wyższy niż prognozy analityków — raport okresowy zaplanowany jest za 2 tygodnie.", "tak": true, "r": "P", "o": "B", "h": "Informacja poufna", "e": "Od chwili, gdy zarząd ma tę wiedzę wystarczająco pewną, to informacja poufna. Ujawnić niezwłocznie, np. jako wyniki szacunkowe, a nie czekać na zaplanowaną datę raportu. Termin raportu okresowego nie jest uzasadnionym interesem spółki, więc pierwszego warunku opóźnienia nie da się spełnić. Opóźnienie byłoby też niedopuszczalne, gdyby wynik był sprzeczny z wcześniejszą prognozą spółki."}, {"q": "Członek rady nadzorczej kupuje akcje spółki za 30 000 EUR 45 dni przed planowaną publikacją raportu kwartalnego.", "tak": true, "r": "T", "o": "", "h": "Dozwolone, ale trzeba zgłosić", "e": "Transakcja jest poza okresem zamkniętym (okres zamknięty trwa 30 dni przed raportem), więc jest dozwolona. Wartość 30 000 EUR przekracza próg 20 000 EUR. Kto: członek rady nadzorczej. Komu: emitentowi i KNF — obu. Termin: niezwłocznie, najpóźniej 3 dni robocze po dniu transakcji. Emitent publikuje informację w ciągu 2 dni roboczych od otrzymania zawiadomienia (art. 19 ust. 1, 3 i 8 MAR)."}, {"q": "Żona członka zarządu, prowadząca z nim wspólne gospodarstwo domowe, kupuje akcje spółki za 8000 EUR. W tym samym roku członek zarządu kupił akcje spółki za 15 000 EUR.", "tak": false, "r": "", "o": "", "h": "Nie trzeba zgłaszać", "e": "Każda osoba ma własny limit 20 000 EUR rocznie. Transakcji członka zarządu (15 000 EUR) i żony (8000 EUR) nie łączy się, choć razem dają 23 000 EUR. Żadna z tych osób nie przekracza własnego limitu, więc nikt nie zawiadamia. Gdyby żona kupiła akcje za ponad 20 000 EUR, zawiadamia ona sama: emitenta i KNF, niezwłocznie, najpóźniej 3 dni robocze po dniu transakcji. Podstawa: art. 19 ust. 1 i 8 MAR oraz Q&A ESMA 7.3."}, {"q": "Sąd rejestrowy zarejestrował zmianę statutu spółki dotyczącą podwyższenia kapitału zakładowego.", "tak": true, "r": "B", "o": "", "h": "Raport bieżący (korporacyjne)", "e": "Max 24 godziny od otrzymania postanowienia sądu (§ 82 ust. 2 rozporządzenia MF)."}, {"q": "Spółka wypowiada umowę firmie audytorskiej badającej jej sprawozdania finansowe.", "tak": true, "r": "B", "o": "", "h": "Raport bieżący (sytuacje kryzysowe)", "e": "§ 5 pkt 3 rozporządzenia MF."}, {"q": "Analityk giełdowy niezależnie od spółki publikuje własną prognozę jej wyników, która później okazuje się trafna — spółka nie przekazała mu żadnych niepublicznych danych.", "tak": false, "r": "", "o": "", "h": "Brak obowiązku spółki", "e": "To niezależna analiza zewnętrzna — spółka niczego nie ujawniła i nie musi reagować."}, {"q": "Spółka wykrywa błąd księgowy z poprzedniego roku obrotowego, który istotnie zmienia wcześniej opublikowany wynik finansowy.", "tak": true, "r": "PB", "o": "", "h": "Informacja poufna + korekta raportu", "e": "Ujawnienie niezwłoczne jako informacja poufna, a dodatkowo raport bieżący informujący o przedmiocie i charakterze korekty (§ 16 ust. 4 rozporządzenia MF)."}, {"q": "Akcjonariusz posiadający 60% głosów sprzedaje część akcji, w wyniku czego jego udział spada do 49%.", "tak": true, "r": "Z", "o": "B", "h": "Znaczne pakiety akcji", "e": "Przekroczenie w dół progu 50% — obowiązek zawiadomienia. Kto: akcjonariusz. Komu: KNF i spółka (obu adresatom). Spółka publikuje zawiadomienie (art. 70 pkt 1)."}, {"q": "Prezes zarządu, w trakcie okresu zamkniętego, dziedziczy po zmarłym krewnym akcje spółki o wartości 60 000 EUR.", "tak": true, "r": "T", "o": "", "h": "Dozwolone, ale trzeba zgłosić", "e": "Wyjątek „czynniki zewnętrzne”: dziedziczenie nie jest decyzją inwestycyjną prezesa, więc jest dozwolone (art. 19 ust. 12a MAR). Dziedziczenie jest transakcją podlegającą zgłoszeniu (art. 10 rozporządzenia delegowanego 2016/522), a wartość 60 000 EUR przekracza próg 20 000 EUR. Kto: prezes. Komu: emitentowi i KNF — obu. Termin: niezwłocznie, najpóźniej 3 dni robocze po dniu transakcji. Emitent publikuje informację w ciągu 2 dni roboczych od otrzymania zawiadomienia (art. 19 ust. 1, 3, 8 i 12a MAR, art. 10 rozporządzenia delegowanego 2016/522)."}, {"q": "Spółka zawiera umowę na dostawę materiałów biurowych o wartości nieistotnej dla jej działalności.", "tak": false, "r": "", "o": "", "h": "Brak obowiązku", "e": "Zdarzenie nieistotne, niecenotwórcze — nie spełnia kryteriów żadnej kategorii."}, {"q": "Spółka ma poważne kłopoty z płynnością: jej kondycja finansowa jest bezpośrednio zagrożona, ale nie złożyła wniosku o upadłość. Zarząd negocjuje z bankami restrukturyzację długu i chce opóźnić ujawnienie sytuacji, bo publikacja mogłaby zerwać negocjacje. Czy musi to opublikować od razu?", "tak": true, "r": "P", "o": "B", "h": "Informacja poufna. Publikację można opóźnić, jeśli spełnione są trzy warunki", "e": "Poważne i bezpośrednie zagrożenie kondycji finansowej to informacja poufna. Samo zagrożenie płynności jest odrębną okolicznością, a nie etapem pośrednim procesu, więc co do zasady trzeba je ujawnić niezwłocznie. Spółka może opóźnić publikację, jeśli spełnia wszystkie trzy warunki: (1) uzasadniony interes: ujawnienie mogłoby zagrozić negocjacjom, które mają poprawić sytuację finansową (przykład z wytycznych ESMA, pod warunkiem że nie stosuje się przepisów upadłościowych; wytyczne są aktualizowane); (2) informacja nie jest sprzeczna z ostatnim komunikatem spółki w tej sprawie, np. spółka nie zapewniała publicznie, że sytuacja jest stabilna; (3) poufność jest zachowana. KNF dostaje zawiadomienie po publikacji. Gdy poufność zostanie utracona, informację trzeba ujawnić niezwłocznie."}, {"q": "Pracownik działu finansowego przypadkiem podsłuchuje w windzie rozmowę zarządu o planowanej fuzji.", "tak": false, "r": "", "o": "", "h": "Staje się insiderem", "e": "Od tej chwili posiada informację poufną i obowiązują go związane z tym zakazy — powinien też trafić na listę osób mających dostęp do informacji poufnej. Nie powstaje publikacja. Spółka dopisuje osobę do listy osób mających dostęp do informacji poufnej."}, {"q": "Wiceprezes zarządu dokonuje w ciągu roku dwóch transakcji akcjami spółki: pierwszej za 8000 EUR, drugiej za 13 000 EUR.", "tak": true, "r": "T", "o": "", "h": "Trzeba zgłosić obie", "e": "Po drugiej transakcji łączna wartość (21 000 EUR) przekracza próg 20 000 EUR — zgłasza się obie transakcje, nie tylko nadwyżkę. Kto: członek zarządu. Komu: emitentowi i KNF — obu. Termin: 3 dni robocze po dniu transakcji (art. 19 ust. 1 MAR). Emitent publikuje informację w ciągu 2 dni roboczych od otrzymania zawiadomienia (art. 19 ust. 3 MAR)."}, {"q": "Spółka notowana na NewConnect publikuje informację o istotnym zdarzeniu dotyczącym jej działalności.", "tak": true, "r": "B", "o": "P", "h": "Raport bieżący (EBI)", "e": "Na NewConnect też publikuje się raport bieżący. Przekazuje się go przez EBI, a nie przez ESPI. Podstawa: załącznik nr 3 do Regulaminu ASO, nie ustawa o ofercie."}, {"q": "Informacja o planowanym dużym kontrakcie eksportowym spółki wyciekła do dziennikarza przed planowaną publikacją.", "tak": true, "r": "P", "o": "B", "h": "Natychmiastowe ujawnienie", "e": "Poufność przestała być zapewniona — spółka musi niezwłocznie opublikować informację, opóźnienie nie jest już możliwe."}, {"q": "Uprawomocnia się postanowienie sądu o ogłoszeniu upadłości spółki.", "tak": true, "r": "B", "o": "", "h": "Raport bieżący (sytuacje kryzysowe)", "e": "§ 5 pkt 8 rozporządzenia MF."}, {"q": "Członek zarządu nabywa akcje spółki o wartości 25 000 EUR w ramach pracowniczego programu akcyjnego, o warunkach ustalonych z góry, w trakcie okresu zamkniętego.", "tak": true, "r": "T", "o": "", "h": "Dozwolone, ale trzeba zgłosić", "e": "Wyjątek „brak aktywnej decyzji inwestycyjnej”: warunki programu ustalono z góry, więc nabycie jest dozwolone (art. 19 ust. 12a MAR). Wartość 25 000 EUR przekracza próg 20 000 EUR. Kto: członek zarządu. Komu: emitentowi i KNF — obu. Termin: niezwłocznie, najpóźniej 3 dni robocze po dniu transakcji. Emitent publikuje informację w ciągu 2 dni roboczych od otrzymania zawiadomienia (art. 19 ust. 1, 3, 8 i 12a MAR)."}, {"q": "Inwestor finansowy zawiadamia KNF i spółkę o przekroczeniu progu 10% głosów.", "tak": true, "r": "B", "o": "Z", "h": "Spółka publikuje jako raport bieżący", "e": "Po otrzymaniu zawiadomienia od akcjonariusza spółka publikuje je jako raport bieżący. Podstawa: art. 70 pkt 1 ustawy o ofercie — niezwłocznie, równocześnie do publicznej wiadomości, KNF i GPW."}, {"q": "Spółka zmienia wcześniej ogłoszoną datę publikacji raportu rocznego.", "tak": true, "r": "B", "o": "", "h": "Raport bieżący", "e": "Informujący o zmianie terminu — publikowany min. 2 dni przed nowym terminem lub przed pierwotnie ogłoszoną datą (§ 84 ust. 2 rozporządzenia MF)."}, {"q": "Bank, u którego członek zarządu zastawił swoje akcje spółki jako zabezpieczenie kredytu, przejmuje je w trakcie okresu zamkniętego z powodu niespłacenia zobowiązania. Wartość przejętych akcji wynosi 100 000 EUR.", "tak": true, "r": "T", "o": "", "h": "Dozwolone, ale trzeba zgłosić", "e": "Wyjątek „czynniki zewnętrzne”: to działanie strony trzeciej, więc przejęcie jest dozwolone (art. 19 ust. 12a MAR). Przejęcie akcji przez bank jest transakcją członka zarządu. Wartość 100 000 EUR przekracza próg 20 000 EUR. Kto: członek zarządu, a nie bank. Komu: emitentowi i KNF — obu. Termin: niezwłocznie, najpóźniej 3 dni robocze po dniu transakcji. Emitent publikuje informację w ciągu 2 dni roboczych od otrzymania zawiadomienia (art. 19 ust. 1, 3, 8 i 12a MAR)."}, {"q": "Spółka publikuje raport za pierwsze półrocze roku obrotowego wraz z raportem z przeglądu przez biegłego rewidenta.", "tak": true, "r": "O", "o": "", "h": "Raport okresowy — półroczny", "e": "Termin: do 3 miesięcy od zakończenia półrocza."}, {"q": "Ogólnie spowolniona koniunktura w całej branży, o której piszą wszyscy analitycy rynkowi.", "tak": false, "r": "", "o": "", "h": "Brak obowiązku", "e": "To nie dotyczy konkretnie emitenta — ogólna sytuacja rynkowa lub branżowa nie jest informacją poufną."}, {"q": "Akcjonariusz nie dopełnia w terminie obowiązku zawiadomienia o przekroczeniu progu głosów.", "tak": true, "r": "Z", "o": "", "h": "Sankcja", "e": "Traci prawo wykonywania głosu z akcji objętych naruszeniem (transakcja pozostaje ważna) i naraża się na karę administracyjną. Zawiadomienie nadal trzeba złożyć niezwłocznie do KNF i spółki."}, {"q": "Członek zarządu sprzedaje akcje spółki poza okresem zamkniętym, za kwotę 25 000 EUR.", "tak": true, "r": "T", "o": "", "h": "Trzeba zgłosić", "e": "W ciągu 3 dni roboczych — przekroczony próg 20 000 EUR. Kto: członek zarządu. Komu: emitentowi i KNF — obu. Emitent publikuje informację w ciągu 2 dni roboczych od otrzymania zawiadomienia (art. 19 ust. 3 MAR)."}, {"q": "Zarząd emitenta ustala i przekazuje na początku roku harmonogram publikacji wszystkich raportów okresowych na dany rok.", const FORM_ENTRIES = ['entry.1583259607', 'entry.1988931307', 'entry.354888456', 'entry.344383554', 'entry.115946191', 'entry.1874690310', 'entry.1274796494', 'entry.519409826', 'entry.1392960591', 'entry.147561734', 'entry.1714186803', 'entry.1141374752', 'entry.256638722', 'entry.87319340', 'entry.1325342003', 'entry.451354250', 'entry.442967941', 'entry.311217928', 'entry.24266598', 'entry.471903172', 'entry.1186306501', 'entry.382582853', 'entry.1627056679', 'entry.259548994', 'entry.424760739', 'entry.1152334452', 'entry.687725574', 'entry.683797894', 'entry.1009295638', 'entry.538813992', 'entry.1340981236', 'entry.1798669122', 'entry.1927765638', 'entry.779142212', 'entry.938329155', 'entry.1270398364', 'entry.738847973', 'entry.94867216', 'entry.1427512724', 'entry.1477098291', 'entry.675793338', 'entry.458065329', 'entry.1064115536', 'entry.223555419'];  // 44 pozycje: ['entry.111', 'entry.222', ...]
function wyslij(n, odp){
  if(!FORM_URL || FORM_ENTRIES.length!==CASE.length) return;
  const klucz='raportyWyslane';
  let w={}; try{ w=JSON.parse(localStorage.getItem(klucz)||'{}'); }catch(e){}
  if(w[n]) return;
  const vals = odp.tak ? odp.typy.map(k=>KAT[k]) : ['NIE'];
  const q = vals.map(v=>FORM_ENTRIES[n]+'='+encodeURIComponent(v)).join('&');
  const img = new Image(); img.referrerPolicy='no-referrer'; img.src = FORM_URL+'?'+q+'&submit=Submit';
  w[n]=1; try{ localStorage.setItem(klucz, JSON.stringify(w)); }catch(e){}
}

/* ================== STAN ================== */
let ODP = {};           // n -> {tak:bool, typy:[...]}
if(/[?&]reset\b/.test(location.search)){ try{ localStorage.removeItem('raportyOdp'); localStorage.removeItem('raportyWyslane'); }catch(e){} history.replaceState(null,'',location.pathname); }
try{ ODP = JSON.parse(localStorage.getItem('raportyOdp')||'{}'); }catch(e){}
function zapisz(){ try{ localStorage.setItem('raportyOdp', JSON.stringify(ODP)); }catch(e){} }
let OD=0, DO=CASE.length-1, wybor=[];

const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(html){ app.innerHTML='<div class="fade">'+html+'</div>'; window.scrollTo(0,0); }
const DISC = '<p class="disc">Ćwiczenie na zajęcia z architektury rynku kapitałowego. Cel wyłącznie edukacyjny.<br>Wersja 2</p>';
const kat = k => `<span class="k${k}" style="font-weight:600">${KAT[k]}</span>`;

function dobrze(n){
  const c=CASE[n], a=ODP[n]; if(!a) return false;
  if(a.tak!==c.tak) return false;
  if(!c.tak) return true;
  const req=c.r.split(''), dozw=(c.r+c.o).split('');
  return req.every(k=>a.typy.includes(k)) && a.typy.every(k=>dozw.includes(k));
}

/* ================== WIDOKI ================== */
function start(){
  const zrobione = Object.keys(ODP).length;
  render(`
    <h1>Obowiązki informacyjne</h1>
    <div class="card"><p>${CASE.length} scenariuszy z życia spółki publicznej. Przy każdym zdecyduj:</p>
      <p style="margin:0 0 4px">1. Czy potrzebna jest publikacja lub zawiadomienie?</p>
      <p style="margin:0">2. Jeśli tak, jakiego rodzaju?</p></div>
    <div class="card"><h3>Rodzaje</h3>${KOD.map(k=>`<p style="margin:0 0 4px">${kat(k)}</p>`).join('')}</div>
    <p class="small" style="margin:4px 0 8px">Wybierz część, którą robimy teraz:</p>
    ${CZESCI.map(([a,b],i)=>{
      const ile=CASE.slice(a-1,b).filter((_,j)=>ODP[a-1+j]).length;
      return `<button class="btn" onclick="czesc(${a-1},${b-1})"><b>Scenariusze ${a}–${b}</b><span>${ile?`zrobione ${ile} z ${b-a+1}`:'&nbsp;'}</span></button>`;}).join('')}
    <button class="btn" onclick="czesc(0,${CASE.length-1})"><b>Wszystkie scenariusze</b><span>${zrobione?`zrobione ${zrobione} z ${CASE.length}`:'&nbsp;'}</span></button>
    ${DISC}`);
}
function czesc(a,b){
  OD=a; DO=b;
  for(let n=a;n<=b;n++) if(!ODP[n]) return pytanie(n);
  wynik();
}

function naglowek(n){
  const ile=DO-OD+1, pos=n-OD;
  return `<div class="bar"><i style="width:${Math.round(pos/ile*100)}%"></i></div>
    <p class="small" style="margin:0 0 4px">Scenariusz ${n+1} · ${pos+1} z ${ile} w tej części</p>
    <div class="card"><h2>${esc(CASE[n].q)}</h2></div>`;
}

function pytanie(n){
  render(`${naglowek(n)}
    <p style="font-weight:600;margin:6px 0 10px">Czy potrzebna jest publikacja lub zawiadomienie?</p>
    <div class="row">
      <button class="btn" onclick="tak(${n})"><b>TAK</b></button>
      <button class="btn" onclick="nie(${n})"><b>NIE</b></button>
    </div>
    ${n>OD?`<button class="link" onclick="pytanie(${n-1})">← Poprzedni scenariusz</button>`:'<button class="link" onclick="start()">← Wybór części</button>'}`);
}
function nie(n){ ODP[n]={tak:false,typy:[]}; zapisz(); wyslij(n,ODP[n]); dalej(n); }
function tak(n){ wybor=[]; rodzaj(n); }
function rodzaj(n){
  render(`${naglowek(n)}
    <p style="font-weight:600;margin:6px 0 2px">Jakiego rodzaju?</p>
    <p class="small" style="margin:0 0 10px">Zaznacz wszystkie, które pasują.</p>
    ${KOD.map(k=>`<button class="btn ${wybor.includes(k)?'on':''}" onclick="przelacz(${n},'${k}')"><b class="k${k}">${wybor.includes(k)?'✓ ':''}${KAT[k]}</b></button>`).join('')}
    <button class="btn main" ${wybor.length?'':'disabled'} onclick="zatwierdz(${n})">Dalej</button>
    <button class="link" onclick="pytanie(${n})">← Wróć do TAK / NIE</button>`);
}
function przelacz(n,k){ wybor = wybor.includes(k)? wybor.filter(x=>x!==k) : [...wybor,k]; rodzaj(n); }
function zatwierdz(n){ ODP[n]={tak:true,typy:KOD.filter(k=>wybor.includes(k))}; zapisz(); wyslij(n,ODP[n]); dalej(n); }
function dalej(n){ if(n<DO) pytanie(n+1); else wynik(); }

function opisOdp(a){ return !a?'brak':a.tak?'TAK: '+a.typy.map(k=>KAT[k]).join(', '):'NIE'; }
function opisKlucza(c){ return c.tak?'TAK: '+c.r.split('').map(kat).join(' + '):'NIE'; }

function wynik(){
  const nr=[]; for(let n=OD;n<=DO;n++) nr.push(n);
  const pkt=nr.filter(dobrze).length;
  render(`
    <p class="small" style="margin:6px 0 2px">Wynik: scenariusze ${OD+1}–${DO+1}</p>
    <div class="score">${pkt} / ${nr.length}</div>
    <p>Twoje odpowiedzi trafiły do zestawienia sali. Za chwilę omówimy je razem.</p>
    ${nr.map(n=>{const c=CASE[n],ok=dobrze(n);return `
      <div class="card"><p class="small" style="margin:0 0 4px">Scenariusz ${n+1}</p>
        <p style="margin:0 0 8px">${esc(c.q)}</p>
        <p style="margin:0 0 6px"><span class="${ok?'ok':'bad'}">${ok?'Dobrze.':'Źle.'}</span> Klucz: ${opisKlucza(c)}.${ok?'':` Twoja odpowiedź: ${esc(opisOdp(ODP[n]))}.`}</p>
        <h3>${esc(c.h)}</h3><p style="margin:0">${esc(c.e)}</p></div>`;}).join('')}
    <button class="btn main" onclick="jeszczeRaz()">Rozwiąż tę część jeszcze raz</button>
    <button class="btn" onclick="start()">Wybór części</button>
    ${DISC}`);
}
function jeszczeRaz(){ for(let n=OD;n<=DO;n++) delete ODP[n]; zapisz(); pytanie(OD); }

/* --- Tryb sali: ?sala (lub ?sala=12), na rzutnik --- */
function sala(n, pokaz){
  document.body.classList.add('sala');
  const c=CASE[n];
  render(`
    <div class="bar"><i style="width:${Math.round(n/(CASE.length-1)*100)}%"></i></div>
    <p class="small" style="margin:0 0 8px">Scenariusz ${n+1} z ${CASE.length}</p>
    <div class="card"><h2>${esc(c.q)}</h2></div>
    ${pokaz?`<div class="card fill"><h3>${opisKlucza(c)}</h3><h3>${esc(c.h)}</h3><p style="margin:0">${esc(c.e)}</p></div>`
      :`<button class="btn main" onclick="sala(${n},true)">Pokaż odpowiedź</button>`}
    <div class="row">
      <button class="btn" ${n>0?'':'disabled'} onclick="sala(${n-1},false)">← Poprzedni</button>
      <button class="btn" ${n<CASE.length-1?'':'disabled'} onclick="sala(${n+1},false)">Następny →</button>
    </div>
    <p class="small">Przejdź do scenariusza: <input class="jump" type="number" min="1" max="${CASE.length}" onchange="sala(Math.min(${CASE.length},Math.max(1,+this.value||1))-1,false)"></p>`);
}

const prm = new URLSearchParams(location.search);
if(prm.has('sala')) sala(Math.min(CASE.length,Math.max(1,+prm.get('sala')||1))-1,false); else start();
</script>
</body>
</html>
